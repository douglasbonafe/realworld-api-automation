name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily. The target is a third-party service, so a nightly run is
    # what tells us the API changed — a repository with no commits would
    # otherwise go silent while its contract quietly drifted.
    - cron: "0 6 * * *"

env:
  REALWORLD_BASE_URL: https://api.realworld.show/api

jobs:
  reachable:
    name: Target reachable
    runs-on: ubuntu-latest
    steps:
      - name: Check the API answers before spending a build on it
        run: |
          # GET /tags is one of the few genuinely public endpoints on this
          # deployment, which makes it the right connectivity probe. Failing
          # here produces "the sandbox is down", not forty confusing red tests.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$REALWORLD_BASE_URL/tags")
          echo "GET $REALWORLD_BASE_URL/tags -> $code"
          test "$code" = "200"

  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [reachable]
    timeout-minutes: 20
    strategy:
      # Never fail-fast: three independent implementations of the same
      # scenarios, and knowing that two passed while one failed is the single
      # most useful signal this repository produces.
      fail-fast: false
      # Not `matrix` parallelism across modules by accident — see below.
      max-parallel: 1
      matrix:
        module:
          - testng-java-httpclient
          - springboot-junit-restclient
          - springboot-restassured
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # max-parallel: 1 above, and no parallelism inside any module.
      #
      # api.realworld.show keeps ONE global session: registering a user replaces
      # the current identity for every caller, including other CI jobs hitting
      # the same host at the same time. Two modules running concurrently would
      # authenticate as each other's users.
      #
      # Verified: register A, register B, then GET /user with A's token returns
      # B. See docs/contract-findings.md, finding #1. Against a self-hosted
      # backend this whole constraint disappears.
      - name: Run ${{ matrix.module }}
        run: mvn -B -pl ${{ matrix.module }} -am test -Drealworld.base.url=$REALWORLD_BASE_URL

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/target/surefire-reports
            ${{ matrix.module }}/test-output
          retention-days: 7

  contract-gaps:
    name: Known contract gaps (informational)
    runs-on: ubuntu-latest
    needs: [build]
    # Never blocks a merge. This job exists to answer one question: has the
    # upstream service fixed anything? A green run here means a gap closed and
    # the test should be promoted out of the excluded group.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run the excluded group
        run: |
          mvn -B -pl testng-java-httpclient -am test \
            -Dgroups=contract-gaps \
            -Drealworld.base.url=$REALWORLD_BASE_URL
